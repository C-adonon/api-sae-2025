spring.application.name=SAE
# Port du serveur
server.port=8080

# Base de données H2 (mémoire) - Le nom 'saedb' est important pour Swagger
spring.datasource.url=jdbc:h2:mem:saedb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console H2 (pour vérifier tes tables en direct)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate : Création automatique des tables à partir de tes entités
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- SÉCURITÉ : Identifiants fixes pour tes tests ---
# Utilise ceux-là sur la page http://localhost:8080/login
spring.security.user.name=admin
spring.security.user.password=admin